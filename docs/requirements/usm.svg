<text class="head" x="890" y="130">3. INSPECT</text>
<text class="actor" x="890" y="156">Operator / application</text>
<rect x="1224" y="100" width="342" height="84" rx="10" fill="#f0f3f7"/>
<text class="head" x="1240" y="130">4. DECIDE</text>
<text class="actor" x="1240" y="156">SaaS application</text>
