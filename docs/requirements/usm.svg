<text class="foot" x="36" y="243">Must-have</text>
<text class="foot" x="36" y="265">CP1 scope</text>
<rect x="174" y="185" width="342" height="172" rx="9" fill="#e7f3ec" stroke="#21834d" stroke-width="1.4"/>
<text class="cell" x="190" y="216">US-001  Register customer &amp;</text>
<text class="cell" x="190" y="239">meter</text>
