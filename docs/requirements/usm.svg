<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 700" width="1570" height="700" role="img" aria-label="Meterly User Story Map with MVP and future release slices">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#192633}.title{font-weight:700;font-size:29px}.sub{font-size:15px;fill:#556678}.head{font-size:17px;font-weight:700}.actor{font-size:15px;fill:#506573}.rowlabel{font-size:14px;font-weight:700}.cell{font-size:17px}.id{font-weight:700}.foot{font-size:14px;fill:#506573}</style>
<text class="title" x="24" y="44">Meterly — User Story Map</text>
<text class="sub" x="24" y="73">Horizontal: user journey  •  Vertical: release slices  •  MVP: US-001–US-006</text>
